# manifests/60-taxdocs-api.ingress.yaml - external reach.
# k3d ships Traefik as its default ingress controller; the cluster was
# created with --port "8080:80@loadbalancer", so a curl to
# localhost:8080 with the matching Host header reaches this Ingress.
# Use `ingressClassName` (NOT the deprecated annotation form).

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taxdocs-api
  namespace: taxdocs-dev
  labels:
    app.kubernetes.io/name: taxdocs-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: taxdocs
    app.kubernetes.io/managed-by: kubectl
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: taxdocs.dev.uptimecrew.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: taxdocs-api
                port: { number: 8080 }
