# base/50-taxdocs-api.hpa.yaml
# W6D2 Task 2: autoscale on taxdocs_inflight_requests (a custom Prometheus
# metric via the Prometheus Adapter), NOT CPU. CPU-based scaling is blind to
# LLM-API-bound latency -- the pod is waiting on the network, CPU stays low
# while p99 climbs and in-flight requests pile up. averageValue: 8 comes from
# a single-replica saturation test ramped to the 500ms p99 SLO
# (reference/SRE-CAPSTONE.md).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: taxdocs-api-hpa
  namespace: taxdocs-dev
  labels:
    app.kubernetes.io/name: taxdocs-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: taxdocs
    app.kubernetes.io/managed-by: kubectl
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind:       Deployment
    name:       taxdocs-api
  minReplicas: 2
  maxReplicas: 30
  metrics:
    - type: Pods
      pods:
        metric:
          name: taxdocs_inflight_requests
        target:
          type:         AverageValue
          averageValue: "8"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0          # react fast on burst
      policies:
        - { type: Percent, value: 100, periodSeconds: 60 }
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 600        # outlast a bursty dip
      policies:
        - { type: Percent, value: 25, periodSeconds: 60 }
      selectPolicy: Min
