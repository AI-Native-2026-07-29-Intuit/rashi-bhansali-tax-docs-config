# base/00-namespace.yaml - the bounded blast radius for taxdocs-api, GitOps-managed half.
#
# ResourceQuota + LimitRange stay in the app repo's manifests/00-namespace.yaml as a
# platform-applied-once concern, not copied here. The AppProject's namespaceResourceBlacklist
# (argocd/projects/taxdocs.yaml) denies ResourceQuota and LimitRange for exactly this reason:
# Argo CD only owns the Namespace object itself, quota/limit ceilings are the platform team's.
apiVersion: v1
kind: Namespace
metadata:
  name: taxdocs-dev
  labels:
    app.kubernetes.io/part-of: taxdocs
    app.kubernetes.io/managed-by: argocd
