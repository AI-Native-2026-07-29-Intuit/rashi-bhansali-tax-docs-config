apiVersion: v1
kind: Namespace
metadata:
  name: taxdocs-dev
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: taxdocs-dev-quota
  namespace: taxdocs-dev
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    # No limits.cpu: Kubernetes requires every pod in a namespace to set any
    # resource type its quota tracks, so a limits.cpu entry here would force
    # a CPU limit onto taxdocs-api -- exactly what Task 3 says to avoid (CFS
    # throttling on burst). limits.memory still caps the OOM line.
    limits.memory: 16Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: taxdocs-dev-limits
  namespace: taxdocs-dev
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        # No default cpu limit: Task 3 requires the taxdocs-api container to
        # have no limits.cpu (avoids CFS throttling on burst; the HPA target
        # is a % of requests.cpu, not limits.cpu). A default here would
        # silently reintroduce a CPU limit on any container that omits one.
        memory: 768Mi
