# base/45-taxdocs-api.anthropic.secret.yaml - Anthropic API key.
# Use `stringData` (plaintext input; Kubernetes base64-encodes for you)
# NOT `data` (hand-base64). The placeholder value is replaced out-of-band
# per env (kubectl create --dry-run=client -o yaml, applied with
# --field-manager=local-secret-override) from the Anthropic Console
# workspace key -- never from a value committed here.
#
# This file MUST NOT contain a real key. Engineers regenerate locally via:
#   kubectl create secret generic anthropic-api \
#     --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
#     -n taxdocs-dev --dry-run=client -o yaml \
#     | kubectl apply --field-manager=local-secret-override -f -
#
# Key is ANTHROPIC_API_KEY: src/main/resources/application.yml reads
# spring.ai.anthropic.api-key from ${ANTHROPIC_API_KEY:dummy} specifically --
# any other name is silently never read, and the app falls back to the
# "dummy" placeholder instead of erroring.

apiVersion: v1
kind: Secret
metadata:
  name: anthropic-api
  namespace: taxdocs-dev
  labels:
    app.kubernetes.io/name: taxdocs-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: taxdocs
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  ANTHROPIC_API_KEY: replace-at-apply-time-from-anthropic-console
