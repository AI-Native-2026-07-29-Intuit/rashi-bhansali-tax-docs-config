# manifests/40-taxdocs-api.secret.yaml - secret env.
# Use `stringData` (plaintext input; Kubernetes base64-encodes for you)
# NOT `data` (hand-base64). The placeholder value is replaced in CI by
# a value pulled from a real secrets manager (External Secrets Operator
# in prod; kubectl-create from a CI secret here).
#
# This file MUST NOT contain a real password. Engineers regenerate
# locally via:
#   kubectl create secret generic taxdocs-api-secrets \
#     --from-literal=DB_PASSWORD=$(pwgen -s 24 1) \
#     -n taxdocs-dev --dry-run=client -o yaml \
#     > manifests/40-taxdocs-api.secret.local.yaml
# and apply the .local copy (gitignored).
#
# Key is DB_PASSWORD, not SPRING_DATASOURCE_PASSWORD: application.yml reads
# spring.datasource.password from ${DB_PASSWORD:devpass} specifically (see
# src/main/resources/application.yml line 9) -- that is the one env var
# name Spring Boot's placeholder resolution looks up here, so any other
# name is silently never read, and spring.datasource.password quietly
# falls back to the "devpass" default instead of erroring.

apiVersion: v1
kind: Secret
metadata:
  name: taxdocs-api-secrets
  namespace: taxdocs-dev
  labels:
    app.kubernetes.io/name: taxdocs-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: taxdocs
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  DB_PASSWORD: replace-at-apply-time-from-secrets-manager
