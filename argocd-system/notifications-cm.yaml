# argocd-system/notifications-cm.yaml
#
# argocd-notifications-controller reads this ConfigMap to know which
# services/triggers/templates exist and which subscriptions route events
# to them. It looks up the Slack token at $slack-token, which resolves
# against the argocd-notifications-secret Secret's slack-token key
# (created out-of-band -- see Task 4 subtask 1, never committed here).
#
# Deliberately NO on-sync-succeeded trigger: subscribing every Application
# to it produces a deploy-firehose nobody reads. Only failure/degradation
# states page a human.
apiVersion: v1
kind:       ConfigMap
metadata:
  name:      argocd-notifications-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name:    argocd-notifications-cm
    app.kubernetes.io/part-of: argocd
data:
  service.slack: |
    token: $slack-token

  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      send: [app-sync-failed]

  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [app-health-degraded]

  template.app-sync-failed: |
    message: |
      :x: *{{.app.metadata.name}}* sync failed.
      Project: {{.app.spec.project}}
      Namespace: {{.app.spec.destination.namespace}}
      Revision: {{.app.status.sync.revision}}
      Message: {{.app.status.operationState.message}}
      {{if .context.argocdUrl}}<{{.context.argocdUrl}}/applications/{{.app.metadata.name}}|View in Argo CD>{{end}}

  template.app-health-degraded: |
    message: |
      :warning: *{{.app.metadata.name}}* health degraded.
      Project: {{.app.spec.project}}
      Namespace: {{.app.spec.destination.namespace}}
      Health: {{.app.status.health.status}}
      {{if .context.argocdUrl}}<{{.context.argocdUrl}}/applications/{{.app.metadata.name}}|View in Argo CD>{{end}}

  # Routes every Application labelled team=taxdocs (all three envs, via
  # argocd/applications/taxdocs-api-dev.yaml and the ApplicationSet's
  # template) to #taxdocs-deploys-rashi-bhansali for both triggers above.
  subscriptions: |
    - recipients:
        - slack:taxdocs-deploys-rashi-bhansali
      triggers:
        - on-sync-failed
        - on-health-degraded
      selector: team=taxdocs
